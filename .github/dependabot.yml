# Keeps GitHub Actions (SHA-pinned) and the toolchain image digest current.
# One uv entry per implemented project (pyproject.toml + uv.lock in the project directory).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The release line (Python 3.14) is a deliberate choice shared with the native CI and
    # `make toolchain`; Dependabot refreshes digests but never changes minor or major versions.
    ignore:
      - dependency-name: "*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: uv
    directory: /00-hello-world
    schedule:
      interval: weekly
    groups:
      uv-00-hello-world:
        patterns: ["*"]
    commit-message:
      prefix: build

  # Hook revisions in .pre-commit-config.yaml (enforced by the pre-commit CI job).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ci
